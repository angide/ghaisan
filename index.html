<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Jadwal Ghaisan 🚀</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- BACKGROUND BINTANG -->
  <div class="stars"></div>

  <!-- ASTRONOT ANIMASI -->
  <div class="astronaut astronaut-1">👨‍🚀</div>
  <div class="astronaut astronaut-2">👩‍🚀</div>

  <!-- HEADER -->
  <header class="hero">

    <div class="hero-content">

      <div class="rocket">🚀</div>

      <div>
        <p class="eyebrow">MISSION CONTROL</p>

        <h1>Jadwal Ghaisan</h1>

        <p class="subtitle">
          Siap belajar, siap menjelajah! 🌟
        </p>
      </div>

    </div>

  </header>


  <main>

    <!-- JUDUL -->
    <section class="intro">

      <h2>🛰️ Jadwal Sekolah</h2>

      <p>
        Pilih hari untuk melihat misi belajar Ghaisan.
      </p>

    </section>


    <!-- TOMBOL HARI -->
    <nav class="day-buttons" aria-label="Pilih hari">

      <button class="day-btn active" data-day="senin">
        🚀 Senin
      </button>

      <button class="day-btn" data-day="selasa">
        🪐 Selasa
      </button>

      <button class="day-btn" data-day="rabu">
        🌙 Rabu
      </button>

      <button class="day-btn" data-day="kamis">
        ⭐ Kamis
      </button>

      <button class="day-btn" data-day="jumat">
        ☀️ Jum'at
      </button>

    </nav>


    <!-- ISI JADWAL -->
    <section
      id="schedule"
      class="schedule-card"
      aria-live="polite">
    </section>

  </main>


  <!-- FOOTER -->
  <footer>

    <p>
      🚀 Semangat belajar, Ghaisan!
      Terus jelajahi ilmu dan raih bintangmu! ⭐
    </p>

  </footer>


  <script src="script.js"></script>

</body>
</html>
