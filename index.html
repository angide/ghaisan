<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jadwal Ghaisan 🚀</title>
  <meta name="description" content="Jadwal sekolah Ghaisan">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stars"></div>

  <header class="hero">
    <div class="planet planet-one"></div>
    <div class="planet planet-two"></div>
    <div class="hero-content">
      <div class="astronaut">👨‍🚀</div>
      <div>
        <p class="eyebrow">MISSION CONTROL</p>
        <h1>Jadwal Ghaisan 🚀</h1>
        <p class="subtitle">Siap belajar, siap menjelajah! 🌟</p>
      </div>
    </div>
  </header>

  <main>
    <section class="intro">
      <h2>🛰️ Jadwal Sekolah</h2>
      <p>Pilih Hari untuk melihat Misi Belajar Ghaisan.</p>
    </section>

    <nav class="day-buttons" aria-label="Pilih hari">
      <button class="day-btn active" data-day="senin">Senin</button>
      <button class="day-btn" data-day="selasa">Selasa</button>
      <button class="day-btn" data-day="rabu">Rabu</button>
      <button class="day-btn" data-day="kamis">Kamis</button>
      <button class="day-btn" data-day="jumat">Jum'at</button>
    </nav>

    <section id="schedule" class="schedule-card" aria-live="polite"></section>
  </main>

  <footer>
    <p>🚀 Semangat belajar, Ghaisan! Terus jelajahi ilmu dan raih bintangmu! ⭐</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
